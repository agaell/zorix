[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zorix"
version = "0.1.0"
description = "Open-source infrastructure intelligence platform foundation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "agaell", email = "agaell@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/agaell/zorix"

[project.scripts]
zorix = "zorix.cli:main"

[tool.setuptools]
packages = [
    "zorix",
    "zorix_core_model",
    "zorix_docker_adapter",
    "zorix_mock_adapter",
    "zorix_plugin_loader",
    "zorix_presentation",
    "zorix_registry",
    "zorix_resource_graph",
    "zorix_scan_engine",
    "zorix_runtime",
]

[tool.setuptools.package-dir]
zorix = "src/zorix"
zorix_core_model = "modules/core_model/src/zorix_core_model"
zorix_docker_adapter = "modules/docker_adapter/src/zorix_docker_adapter"
zorix_mock_adapter = "modules/mock_adapter/src/zorix_mock_adapter"
zorix_plugin_loader = "modules/plugin_loader/src/zorix_plugin_loader"
zorix_presentation = "modules/presentation/src/zorix_presentation"
zorix_registry = "modules/registry/src/zorix_registry"
zorix_resource_graph = "modules/resource_graph/src/zorix_resource_graph"
zorix_scan_engine = "modules/scan_engine/src/zorix_scan_engine"
zorix_runtime = "modules/runtime/src/zorix_runtime"
